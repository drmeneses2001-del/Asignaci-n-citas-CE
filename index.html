<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitud de valoración</title>
<style>
  :root {
    --tinta: #111;
    --borde: #d4d4d8;
    --fondo: #f4f4f5;
    --acento: #ec4899;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fondo);
    color: var(--tinta);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ---------- Pantalla: controles ---------- */

  .controles {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 20px 8px;
  }

  .controles h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }

  .controles p.ayuda {
    margin: 0 0 20px;
    color: #52525b;
    font-size: 14px;
  }

  .campos {
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 20px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .02em;
    text-transform: uppercase;
    color: #3f3f46;
    margin-bottom: 6px;
  }

  select {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    color: inherit;
    background: #fff;
    border: 1px solid #a1a1aa;
    border-radius: 6px;
  }

  select:focus-visible {
    outline: 2px solid var(--acento);
    outline-offset: 1px;
  }

  .acciones {
    max-width: 820px;
    margin: 0 auto;
    padding: 18px 20px 0;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  button {
    font-family: inherit;
    font-size: 15px;
    padding: 11px 22px;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
  }

  #imprimir {
    background: var(--tinta);
    color: #fff;
    font-weight: 600;
  }

  #limpiar {
    background: #fff;
    border-color: #a1a1aa;
    color: #3f3f46;
  }

  .aviso {
    font-size: 13px;
    color: #b91c1c;
    min-height: 18px;
    flex-basis: 100%;
    margin: 0;
  }

  .titulo-vista {
    max-width: 820px;
    margin: 28px auto 8px;
    padding: 0 20px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #71717a;
  }

  /* ---------- La hoja tamaño carta ---------- */

  .hoja {
    width: 21.59cm;              /* 8.5 in */
    min-height: 27.94cm;         /* 11 in  */
    margin: 0 auto 40px;
    padding: 2.5cm;
    background: #fff;
    color: #000;
    font-family: Georgia, "Times New Roman", serif;
    box-shadow: 0 2px 12px rgba(0, 0, 0, .18);
  }

  .leyenda {
    font-size: 22pt;
    font-weight: bold;
    letter-spacing: .01em;
    margin: 0 0 1.6cm;
  }

  .renglon {
    font-size: 16pt;
    line-height: 1.5;
    margin: 0 0 1cm;
  }

  .renglon .etiqueta {
    font-weight: bold;
  }

  .renglon .valor {
    border-bottom: 1px solid #000;
    padding: 0 .35cm 2px;
    display: inline-block;
    min-width: 9cm;
  }

  .firma {
    margin-top: 3.5cm;
    text-align: center;
  }

  .firma .linea {
    border-top: 1px solid #000;
    width: 9cm;
    margin: 0 auto .3cm;
  }

  .firma .nombre {
    font-size: 14pt;
  }

  /* ---------- Impresión: solo la hoja ---------- */

  @page {
    size: letter portrait;
    margin: 0;
  }

  @media print {
    body {
      background: #fff;
      margin: 0;
    }

    .no-imprimir {
      display: none !important;
    }

    .hoja {
      width: auto;
      min-height: auto;
      margin: 0;
      padding: 2.5cm;
      box-shadow: none;
    }
  }
</style>
</head>
<body>

<div class="no-imprimir">
  <div class="controles">
    <h1>Solicitud de valoración</h1>
    <p class="ayuda">Elija los tres datos y presione <strong>Imprimir</strong>. Se imprime únicamente la hoja tamaño carta que se muestra abajo.</p>

    <div class="campos">
      <div>
        <label for="servicio">Servicio</label>
        <select id="servicio">
          <option value="">— Seleccione —</option>
          <option>Medicina materno fetal</option>
          <option>Clínica de menopausia</option>
          <option>Laparoscopia ginecológica</option>
          <option>Obstetricia</option>
          <option>Ginecología vespertino</option>
        </select>
      </div>

      <div>
        <label for="medico">Médico</label>
        <select id="medico">
          <option value="">— Seleccione —</option>
          <option>Dr. Mejía Islas</option>
          <option>Dr. Serrano Berrones</option>
          <option>Dr. Apolo Trujillo</option>
          <option>Dr. Pérez Zúñiga</option>
          <option>Dr. Camal Ugarde</option>
          <option>Dra. Luz María Bravo</option>
          <option>Dra. Alejandra López</option>
        </select>
      </div>

      <div>
        <label for="firma">Firma</label>
        <select id="firma">
          <option value="">— Seleccione —</option>
          <option>Dr. Serrano Berrones</option>
          <option>Dr. Meneses Campos</option>
        </select>
      </div>
    </div>
  </div>

  <div class="acciones">
    <button id="imprimir" type="button">Imprimir</button>
    <button id="limpiar" type="button">Limpiar</button>
    <p class="aviso" id="aviso"></p>
  </div>

  <p class="titulo-vista">Vista previa de la hoja</p>
</div>

<!-- Lo único que se envía a la impresora -->
<section class="hoja" id="hoja">
  <p class="leyenda">FAVOR DE VALORAR:</p>

  <p class="renglon">
    <span class="etiqueta">Servicio:</span>
    <span class="valor" id="v-servicio"></span>
  </p>

  <p class="renglon">
    <span class="etiqueta">Médico:</span>
    <span class="valor" id="v-medico"></span>
  </p>

  <div class="firma">
    <div class="linea"></div>
    <div class="nombre" id="v-firma"></div>
  </div>
</section>

<script>
  const campos = {
    servicio: document.getElementById('servicio'),
    medico: document.getElementById('medico'),
    firma: document.getElementById('firma')
  };

  const salidas = {
    servicio: document.getElementById('v-servicio'),
    medico: document.getElementById('v-medico'),
    firma: document.getElementById('v-firma')
  };

  const aviso = document.getElementById('aviso');

  function actualizar() {
    for (const clave of Object.keys(campos)) {
      salidas[clave].textContent = campos[clave].value;
    }
    aviso.textContent = '';
  }

  for (const campo of Object.values(campos)) {
    campo.addEventListener('change', actualizar);
  }

  document.getElementById('imprimir').addEventListener('click', () => {
    const faltantes = Object.entries(campos)
      .filter(([, campo]) => campo.value === '')
      .map(([clave]) => clave);

    if (faltantes.length > 0) {
      aviso.textContent = 'Seleccione: ' + faltantes.join(', ') + '.';
      campos[faltantes[0]].focus();
      return;
    }

    actualizar();
    window.print();
  });

  document.getElementById('limpiar').addEventListener('click', () => {
    for (const campo of Object.values(campos)) {
      campo.value = '';
    }
    actualizar();
    campos.servicio.focus();
  });

  actualizar();
</script>

</body>
</html>
